name: client

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  just_audio: ^0.10.6
  fl_chart: ^1.1.1
  flutter_animate: ^4.5.2
  app_links: ^7.2.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  supabase_flutter: ^2.17.2
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10
  ffmpeg_kit_flutter_new: ^4.6.2
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700